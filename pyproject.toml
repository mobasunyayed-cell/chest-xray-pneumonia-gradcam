# Tool settings only; the project is run from the repository root, not installed.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are the point of tests

[tool.mypy]
python_version = "3.10"
strict = true
files = ["api"]
follow_imports = "silent"
ignore_missing_imports = true
